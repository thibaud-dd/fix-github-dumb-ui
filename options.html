<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Fix GitHub Dumb UI</title>
    <style>
      :root {
        color-scheme: light dark;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      body {
        margin: 16px;
        min-width: 420px;
        max-width: 560px;
      }
      label,
      .label {
        display: block;
        font-weight: 600;
        margin-bottom: 4px;
      }
      input {
        box-sizing: border-box;
        width: 100%;
        padding: 6px 8px;
        font: inherit;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      .hint,
      #status {
        color: GrayText;
        margin: 8px 0 0;
      }
      #status[data-kind='error'],
      .error {
        color: #d1242f;
        margin: 8px 0 0;
      }
      [hidden] {
        display: none !important;
      }
      code {
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <section id="saved-view" hidden>
      <div class="label">GitHub token</div>
      <p id="status" role="status"></p>
      <div class="actions">
        <button id="change" type="button">Change token</button>
        <button id="remove" type="button">Remove</button>
      </div>
    </section>
    <form id="edit-view" hidden>
      <label for="token">GitHub token</label>
      <input id="token" type="password" autocomplete="off" spellcheck="false" />
      <p class="hint">
        The stack sidebar and the open review comments read GitHub data with this token. To use your gh CLI token, run
        <code>gh auth token --user &lt;login&gt;</code>.
      </p>
      <p id="edit-error" class="error" role="alert" hidden></p>
      <div class="actions">
        <button type="submit">Save</button>
        <button id="cancel" type="button">Cancel</button>
      </div>
    </form>
    <script src="options.js"></script>
  </body>
</html>
